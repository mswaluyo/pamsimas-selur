# ============================================================
# Koyeb Deployment Configuration for PAMSIMAS
# ============================================================
# Deploy: https://app.koyeb.com
# Docs:  https://www.koyeb.com/docs/reference/app-service-schema
# ============================================================

services:
  - name: pamsimas-selur
    type: web
    docker:
      dockerfile: Dockerfile
    ports:
      - port: 8080
        http_match: /
    health_checks:
      - http_path: /health
        port: 8080
        initial_delay_seconds: 60
        period_seconds: 30
        timeout_seconds: 5
        success_threshold: 1
        failure_threshold: 3
    regions:
      - was  # Washington DC (closest free region)
      # Alternative regions: fra (Frankfurt), sin (Singapore)
    instance_types:
      - type: nano  # Free tier: 256MB RAM, 1 vCPU
    scaling:
      min: 1
      max: 1
    env:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://pamsimas-selur.koyeb.app
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/storage/app/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_DRIVER
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: FILESYSTEM_DISK
        value: local
      - key: EASYOCR_MODULE_PATH
        value: /var/www/html/storage/app/.easyocr/model
      - key: EASYOCR_USER_NETWORK_DIRECTORY
        value: /var/www/html/storage/app/.easyocr/user_network
      - key: PYTHON_PATH
        value: /opt/venv/bin/python3
      - key: PORT
        value: "8080"
      - key: RUN_MIGRATIONS
        value: "true"
      # SECRETS - Set these via Koyeb Dashboard > App > Environment Variables
      # - key: APP_KEY
      #   value: base64:YOUR_GENERATED_KEY
      # - key: WA_GATEWAY_SECRET
      #   value: pamsimas-secret-key-123
      # - key: GEMINI_API_KEY
      #   value: your-gemini-api-key
      # - key: DEVICE_API_KEY
      #   value: P4mS1m4s-T1rt0-Arg0-2025

# Optional: Persistent volume for SQLite and meter_photos
# volumes:
#   - name: pamsimas-data
#     path: /var/www/html/storage/app
#     size: 1Gi
