# ============================================================
# Google Cloud Build Configuration
# ============================================================
# Docs: https://cloud.google.com/build/docs/build-config
# ============================================================

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pamsimas-selur:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pamsimas-selur:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/pamsimas-selur:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pamsimas-selur'
      - '--image'
      - 'gcr.io/$PROJECT_ID/pamsimas-selur:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/pamsimas-selur:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/pamsimas-selur:latest'
