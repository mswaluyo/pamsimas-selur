; ==========================================================================
; Supervisor config untuk PAMSIMAS queue worker (mode database)
; Simpan sebagai: /etc/supervisor/conf.d/pamsimas-queue.conf
; Lalu:  supervisorctl reread && supervisorctl update
;        supervisorctl status pamsimas-queue
;
; Catatan: di aaPanel, konfigurasi ini dikelola otomatis saat menambahkan
; daemon lewat GUI (App Store > Supervisor), tapi bisa juga dipasang manual.
; ==========================================================================

[program:pamsimas-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/pamsimas.selur.my.id/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/www/wwwroot/pamsimas.selur.my.id
autostart=true
autorestart=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/pamsimas.selur.my.id/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
