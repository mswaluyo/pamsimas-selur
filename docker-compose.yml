# ============================================================
# Docker Compose untuk testing lokal PAMSIMAS
# ============================================================
# Usage:
#   docker-compose up -d --build
#   docker-compose exec app php artisan migrate
#   docker-compose down
# ============================================================

version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_KEY: base64:replace-with-your-key
      
      DB_CONNECTION: sqlite
      
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_DRIVER: array
      
      LOG_CHANNEL: stderr
      
      # WhatsApp Gateway (sesuaikan dengan gateway Anda)
      WA_GATEWAY_URL: http://host.docker.internal:3000/send-wa
      WA_GATEWAY_SECRET: P4mS1m4s-T1rt0-Arg0-2025
      WA_WEBHOOK_URL: http://localhost:8080/api/api_wa
      WA_GATEWAY_NUMBER: "6285157275866"
      
      # Gemini API (optional)
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-2.5-flash
      
      # Device API
      DEVICE_API_KEY: P4mS1m4s-T1rt0-Arg0-2025
      
      RUN_MIGRATIONS: "true"
    volumes:
      - pamsimas_storage:/var/www/html/storage/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  pamsimas_storage:
    driver: local
